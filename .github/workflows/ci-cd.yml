name: Task 04 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run dummy tests
        run: |
          echo "Running lint..."
          echo "Running tests..."
          echo "All checks passed!"

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t mshamna16shana-glitch/task04:${{ github.sha }} .
          docker build -t mshamna16shana-glitch/task04:latest .

      - name: Build success
        run: echo "✅ Docker image built successfully!"
