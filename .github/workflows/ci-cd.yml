name: Task 04 CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Lint passed ✅"
      - run: echo "Tests passed ✅"
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t task04:latest .
      - run: echo "Task 04 Success 🎉"
